name: CI and deploy Dropfire

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and check client
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check server imports
        working-directory: server
        run: |
          python -m pip install --requirement requirements.txt
          python -m compileall -q app

  deploy:
    name: Deploy to Oracle
    needs: check
    # Pull requests are checked but can never update the public server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure the deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update the game server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/dropfire
            git pull --ff-only origin main

            /home/ubuntu/dropfire/server/.venv/bin/pip install --requirement server/requirements.txt
            cd /home/ubuntu/dropfire/client
            npm ci
            npm run build

            sudo install -d -o caddy -g caddy /var/www/dropfire
            sudo cp -a dist/. /var/www/dropfire/
            sudo chown -R caddy:caddy /var/www/dropfire
            sudo systemctl restart dropfire
            sudo systemctl reload caddy
            curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          REMOTE
