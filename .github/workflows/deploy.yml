name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Queue manual deployments rather than interrupt a running server update.
concurrency:
  group: dropfire-production
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Oracle
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure the deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update the game server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "bash -se -- '$DEPLOY_SHA'" <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/dropfire
            git fetch origin main
            git merge-base --is-ancestor "$1" origin/main
            git merge --ff-only "$1"
            test "$(git rev-parse HEAD)" = "$1"

            /home/ubuntu/dropfire/server/.venv/bin/pip install --requirement server/requirements.txt
            cd /home/ubuntu/dropfire/client
            npm ci
            npm run build

            sudo install -d -o caddy -g caddy /var/www/dropfire
            sudo cp -a dist/. /var/www/dropfire/
            sudo chown -R caddy:caddy /var/www/dropfire
            sudo systemctl restart dropfire
            sudo systemctl reload caddy
            for attempt in {1..10}; do
              if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
                exit 0
              fi
              sleep 2
            done
            sudo systemctl status dropfire --no-pager
            exit 1
          REMOTE
